# macOS half of the bootstrap project.
#
# Loaded automatically next to mise.toml on macOS (auto_env in .miserc.toml).
# Host packages, desktop apps, fonts and system defaults. macOS is
# Homebrew-free: mise's built-in `brew:`/`brew-cask:` managers pour bottles
# and casks into /opt/homebrew without Homebrew being installed.
#
# Cross-platform CLI tools are NOT here - they are `[tools]` in the global
# config. Only things the registry can't provide stay native packages.

[bootstrap.brew]
# Adopt an identical app that is already installed instead of replacing it.
adopt = true

[bootstrap.packages]
# --- Build libraries for compiling ruby/python ---
"brew:autoconf" = "latest"
"brew:automake" = "latest"
"brew:jemalloc" = "latest"
"brew:libffi" = "latest"
"brew:libtool" = "latest"
"brew:libxslt" = "latest"
"brew:libyaml" = "latest"
"brew:openssl@3" = "latest"
"brew:readline" = "latest"
"brew:unixodbc" = "latest"
"brew:xz" = "latest"
"brew:zlib" = "latest"

# --- Core CLI not covered by the mise registry ---
"brew:aria2" = "latest"
"brew:coreutils" = "latest"
"brew:ffmpeg" = "latest"
"brew:gawk" = "latest"
"brew:git" = "latest"
"brew:gnupg" = "latest"
"brew:htop" = "latest"
"brew:ncdu" = "latest"
"brew:neovim" = "latest"
"brew:sqlite" = "latest"
"brew:tig" = "latest"
"brew:tmate" = "latest"
"brew:tmux" = "latest"
"brew:tree" = "latest"
"brew:wget" = "latest"
"brew:zsh" = "latest"

# --- macOS-only helpers ---
"brew:reattach-to-user-namespace" = "latest"
"brew:terminal-notifier" = "latest"
"brew:tmux-mem-cpu-load" = "latest"
# --- Desktop applications ---
"brew-cask:alfred" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:firefox@developer-edition" = "latest"
"brew-cask:forklift" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:itsycal" = "latest"
"brew-cask:jordanbaird-ice" = "latest"
"brew-cask:kitty" = "latest"
"brew-cask:localsend" = "latest"
"brew-cask:mounty" = "latest"
"brew-cask:postman" = "latest"
"brew-cask:quicklook-video" = "latest"
"brew-cask:sanesidebuttons" = "latest"
"brew-cask:shottr" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:spotmenu" = "latest"
"brew-cask:stats" = "latest"
"brew-cask:sublime-merge" = "latest"
"brew-cask:tableplus" = "latest"
"brew-cask:telegram" = "latest"
"brew-cask:the-unarchiver" = "latest"
"brew-cask:trex" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:vlc" = "latest"

# --- Fonts ---
"brew-cask:font-cascadia-mono-pl" = "latest"
"brew-cask:font-consolas-for-powerline" = "latest"
"brew-cask:font-menlo-for-powerline" = "latest"
"brew-cask:font-anonymice-nerd-font" = "latest"
"brew-cask:font-blex-mono-nerd-font" = "latest"
"brew-cask:font-dejavu-sans-mono-nerd-font" = "latest"
"brew-cask:font-droid-sans-mono-nerd-font" = "latest"
