#
# macOS defaults
#
# Migrated from the old bin/apply_default_settings. The handful of settings
# that need root live in bin/apply_sudo_defaults and are run by hand.

[bootstrap.macos.dock]
autohide = true
autohide_delay = 0.0
mru_spaces = false

[bootstrap.macos.finder]
show_extensions_warning = false
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 0
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleKeyboardUIMode = 3
AppleShowAllExtensions = true
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSNavPanelExpandedStateForSaveMode = true
PMPrintingExpandedStateForPrint = true
WebKitDeveloperExtras = true
"com.apple.mouse.tapBehavior" = 1
"com.apple.swipescrolldirection" = false

[bootstrap.macos.defaults."com.apple.dock"]
"dashboard-in-overlay" = true

[bootstrap.macos.defaults."com.apple.finder"]
QLEnableTextSelection = true

[bootstrap.macos.defaults."com.apple.BezelServices"]
kDimTime = 300

[bootstrap.macos.defaults."com.apple.LaunchServices"]
LSQuarantine = false

[bootstrap.macos.defaults."com.apple.screensaver"]
askForPassword = 1
askForPasswordDelay = 0

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
TrackpadCornerSecondaryClick = 2
TrackpadRightClick = true

[bootstrap.macos.defaults."com.apple.universalaccess"]
closeViewScrollWheelToggle = true
closeViewZoomFollowsFocus = true
HIDScrollZoomModifierMask = 262144

[bootstrap.macos.defaults."com.apple.Safari"]
HomePage = "about:blank"
ShowFavoritesBar = false
FindOnPageMatchesWordStartsOnly = false
IncludeInternalDebugMenu = true
IncludeDevelopMenu = true
UniversalSearchEnabled = false
WebKitDeveloperExtrasEnabledPreferenceKey = true
"com.apple.Safari.ContentPageGroupIdentifier.WebKit2DeveloperExtrasEnabled" = true

[bootstrap.macos.defaults."com.apple.addressbook"]
ABShowDebugMenu = true

[bootstrap.macos.defaults."com.apple.iCal"]
IncludeDebugMenu = true

[bootstrap.macos.defaults."com.apple.TextEdit"]
RichText = 0
PlainTextEncoding = 4
PlainTextEncodingForWrite = 4

[bootstrap.macos.defaults."com.apple.DiskUtility"]
DUDebugMenuEnabled = true
"advanced-image-options" = true

[bootstrap.macos.defaults."com.apple.TimeMachine"]
DoNotOfferNewDisksForBackup = true

[bootstrap.macos.defaults."com.apple.print.PrintingPrefs"]
"Quit When Finished" = true

[bootstrap.macos.defaults."com.apple.appstore"]
ShowDebugMenu = true

# VS Code: key repeat instead of the accent popover.
[bootstrap.macos.defaults."com.microsoft.VSCode"]
ApplePressAndHoldEnabled = false

# `defaults -currentHost write ...` equivalents.
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.trackpad.trackpadCornerClickBehavior"
host = "current"
value = 1

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.trackpad.enableSecondaryClick"
host = "current"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

[bootstrap.hooks.post-defaults]
run = "killall Dock Finder SystemUIServer 2>/dev/null || true"
