"brew:autoconf" = { os = "macos" }
"brew:automake" = { os = "macos" }
"brew:jemalloc" = { os = "macos" }
"brew:libffi" = { os = "macos" }
"brew:libtool" = { os = "macos" }
"brew:libxslt" = { os = "macos" }
"brew:libyaml" = { os = "macos" }
"brew:openssl@3" = { os = "macos" }
"brew:readline" = { os = "macos" }
"brew:unixodbc" = { os = "macos" }
"brew:xz" = { os = "macos" }
"brew:zlib" = { os = "macos" }

