#
# Git repositories
#
# Cloned before dotfiles are applied, so ~/.zshrc can source them right away.

[bootstrap.repos]
"~/.zprezto" = { url = "https://github.com/sorin-ionescu/prezto.git" }
"~/.zprezto/contrib" = { url = "https://github.com/belak/prezto-contrib.git" }

# prezto ships its modules as git submodules and `[bootstrap.repos]` does not
# initialise them.
#
# zplug is cloned here rather than declared in `[bootstrap.repos]` because it
# rewrites files inside its own checkout on first use; mise would then treat
# the repo as dirty and abort every later bootstrap.
#
# All commands are idempotent.
[bootstrap.hooks.post-repos]
run = [
  "git -C ~/.zprezto submodule update --init --recursive --depth 1",
  "git -C ~/.zprezto/contrib submodule update --init --recursive --depth 1",
  "[ -d ~/.zplug/.git ] || git clone --depth 1 https://github.com/zplug/zplug.git ~/.zplug",
]

#
# Dotfiles
#
# Sources are relative to this file. Mirrors what `stow` used to produce:
# whole-directory links for config dirs we fully own, individual file links
# everywhere else.

[dotfiles]
# --- Directories we own outright ---
"~/.config/ccstatusline" = { source = "ccstatusline/.config/ccstatusline", mode = "symlink" }
"~/.config/ghostty" = { source = "ghostty/.config/ghostty", mode = "symlink" }
"~/.config/helix" = { source = "helix/.config/helix", mode = "symlink" }
"~/.config/kitty" = { source = "kitty/.config/kitty", mode = "symlink" }
"~/.config/nvim" = { source = "neovim/.config/nvim", mode = "symlink" }
"~/.config/yt-dlp" = { source = "yt-dlp/.config/yt-dlp", mode = "symlink" }
"~/.tmux" = { source = "tmux/.tmux", mode = "symlink" }

# ~/.claude also holds Claude Code's own runtime state (sessions, projects,
# plugins, caches), so link the tracked files individually instead of
# collapsing the whole directory - the old `stow --no-folding` behaviour.
"~/.claude" = { source = "claude/.claude", mode = "symlink-each" }

# --- zsh ---
"~/.aliases" = { source = "zsh/.aliases", mode = "symlink" }
"~/.dircolors" = { source = "zsh/.dircolors", mode = "symlink" }
"~/.dircolors_jellybeans" = { source = "zsh/.dircolors_jellybeans", mode = "symlink" }
"~/.fzf_commands.zsh" = { source = "zsh/.fzf_commands.zsh", mode = "symlink" }
"~/.p10k.zsh" = { source = "zsh/.p10k.zsh", mode = "symlink" }
"~/.zpreztorc" = { source = "zsh/.zpreztorc", mode = "symlink" }
"~/.zprofile" = { source = "zsh/.zprofile", mode = "symlink" }
"~/.zshenv" = { source = "zsh/.zshenv", mode = "symlink" }
"~/.zshrc" = { source = "zsh/.zshrc", mode = "symlink" }

# --- tmux ---
"~/.tmux.conf" = { source = "tmux/.tmux.conf", mode = "symlink" }

# --- ruby ---
"~/.aprc" = { source = "ruby/.aprc", mode = "symlink" }
"~/.gemrc" = { source = "ruby/.gemrc", mode = "symlink" }
"~/.irbrc" = { source = "ruby/.irbrc", mode = "symlink" }
"~/.rdbgrc" = { source = "ruby/.rdbgrc", mode = "symlink" }
"~/.rspec" = { source = "ruby/.rspec", mode = "symlink" }
"~/.rubocop.yml" = { source = "ruby/.rubocop.yml", mode = "symlink" }
"~/.rufo" = { source = "ruby/.rufo", mode = "symlink" }

# --- editors, linters, formatters ---
"~/.iex.exs" = { source = "elixir/.iex.exs", mode = "symlink" }
"~/.ideavimrc" = { source = "jetbrains/.ideavimrc", mode = "symlink" }
"~/.prettierrc" = { source = "prettier/.prettierrc", mode = "symlink" }
"~/.stylelintrc" = { source = "eslint/.stylelintrc", mode = "symlink" }
"~/.wezterm.lua" = { source = "wezterm/.wezterm.lua", mode = "symlink" }

# --- ripgrep ---
"~/.rgignore" = { source = "ripgrep/.rgignore", mode = "symlink" }
"~/.ripgreprc" = { source = "ripgrep/.ripgreprc", mode = "symlink" }

# --- tig ---
"~/.tig-default-theme.tigrc" = { source = "tig/.tig-default-theme.tigrc", mode = "symlink" }
"~/.tig-molokai-like-theme.tigrc" = { source = "tig/.tig-molokai-like-theme.tigrc", mode = "symlink" }
"~/.tigrc" = { source = "tig/.tigrc", mode = "symlink" }

# --- mise ---
# The global mise config is deployed from this repo. It is linked during the
# dotfiles phase, i.e. after mise loaded configuration for this run but before
# the tools phase, so `[bootstrap.hooks.final]` re-runs `mise install` in a
# fresh process to pick up its `[tools]` on a first bootstrap.
"~/.config/mise/config.toml" = { source = "mise/.config/mise/config.toml", mode = "symlink" }
"~/.asdfrc" = { source = "mise/.asdfrc", mode = "symlink" }
"~/.default-gems" = { source = "mise/.default-gems", mode = "symlink" }
"~/.default-golang-pkgs" = { source = "mise/.default-golang-pkgs", mode = "symlink" }
"~/.default-npm-packages" = { source = "mise/.default-npm-packages", mode = "symlink" }
"~/.default-python-packages" = { source = "mise/.default-python-packages", mode = "symlink" }

# --- git ---
# ~/.gitconfig is not managed as a whole file: it also carries the identity set
# by `mise run bootstrap` and any machine-local settings. Only this block is
# owned by mise.
"~/.gitconfig/dotfiles" = { comment = "#", block = '''
[push]
	default = simple
[core]
	pager = diff-so-fancy | less --tabs=4 -RFX
[color]
	ui = true
[color "diff-highlight"]
	oldNormal = red bold
	oldHighlight = red bold 52
	newNormal = green bold
	newHighlight = green bold 22
[color "diff"]
	meta = yellow
	frag = magenta bold
	commit = yellow bold
	old = red bold
	new = green bold
	whitespace = red reverse
''' }

# --- macOS-only ---
[dotfiles."~/.aerospace.toml"]
source = "aerospace/.aerospace.toml"
mode = "symlink"
variants = [{ os = "macos" }]

[dotfiles."~/.yabairc"]
source = "yabai/.yabairc"
mode = "symlink"
variants = [{ os = "macos" }]

[dotfiles."~/.skhdrc"]
source = "yabai/.skhdrc"
mode = "symlink"
variants = [{ os = "macos" }]

