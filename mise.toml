# Bootstrap project for these dotfiles.
#
#   mise trust && mise bootstrap
#
# Everything a new macOS or Linux machine needs lives here: host packages,
# git repos (prezto, zplug), dotfile symlinks, macOS defaults and the login
# shell. Versioned languages and CLI tools live in the *global* mise config,
# which is itself deployed from this repo (mise/.config/mise/config.toml).

#
# Packages
#
# macOS uses mise's built-in `brew:`/`brew-cask:` managers, which pour bottles
# into /opt/homebrew without Homebrew itself being installed. Every brew entry
# is pinned to `os = "macos"` on purpose: the brew manager also works on Linux
# and would otherwise create /home/linuxbrew.
#
# Cross-platform CLI tools are NOT here - they are `[tools]` in the global
# config. Only things the registry can't provide stay native packages.

[bootstrap.brew]
# Adopt an identical app that is already installed instead of replacing it.
adopt = true

[bootstrap.packages]
