# `defaults -currentHost write ...` equivalents.
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.trackpad.trackpadCornerClickBehavior"
host = "current"
value = 1

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.trackpad.enableSecondaryClick"
host = "current"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

[bootstrap.hooks.post-defaults]
run = "killall Dock Finder SystemUIServer 2>/dev/null || true"

#
# Login shell
#
# Valid on macOS and on usr-merged Debian/Ubuntu.

[bootstrap.user]
login_shell = "/bin/zsh"

#
# Final steps
#

# Git identity is machine-specific, so it is prompted for rather than declared.
[tasks.bootstrap]
description = "Prompt for the git identity when this machine has none"
run = """
set -eu

name=$(git config --global user.name || true)
email=$(git config --global user.email || true)

if [ -n "$name" ] && [ -n "$email" ]; then
  echo "git identity already set: $name <$email>"
  exit 0
fi

if [ ! -t 0 ]; then
  echo "git identity is not configured. Set it with:"
  echo "  git config --global user.name \\"Your Name\\""
  echo "  git config --global user.email \\"you@example.com\\""
  exit 0
fi

if [ -z "$name" ]; then
  printf 'What is your full name used by Git? '
  read -r name
  if [ -n "$name" ]; then
    git config --global user.name "$name"
  fi
fi

if [ -z "$email" ]; then
  printf 'What is your Git user email? '
  read -r email
  if [ -n "$email" ]; then
    git config --global user.email "$email"
  fi
fi

echo "git identity: $(git config --global user.name || true) <$(git config --global user.email || true)>"
"""

# The dotfiles phase links the global mise config into place *after* this
# process loaded its configuration, so its `[tools]` are installed here, in a
# fresh process. No-op on every later run.
[bootstrap.hooks.final]
run = "mise install --yes"
