# Environment for the systemd user manager (environment.d(5)).
#
# User services never source the zsh profile, so they only get systemd's
# default PATH. Prepend the user bin dirs so services such as paseo.service
# can find standalone CLIs (claude, codex) and mise-managed tools.
#
# Files from every environment.d directory are applied in filename order, and
# Ubuntu's 99-environment.conf (a link to /etc/environment) sets PATH outright,
# so this file must sort after it.
#
# Read when the user manager starts: log out and back in (or reboot) after
# changing it.
PATH=${HOME}/.local/bin:${HOME}/.local/share/mise/shims:${PATH}
