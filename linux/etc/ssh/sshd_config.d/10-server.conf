# /etc/ssh/sshd_config.d/10-server.conf - managed by mise bootstrap (mise.server.toml)
#
# Server-only tightening on top of 99-vps-hardening.conf. sshd uses the first
# value it reads for single-value options and drop-ins load in name order, so
# 10- wins over 99- for PermitRootLogin and KexAlgorithms.
#
# AllowUsers lines from different files add up rather than replace each other,
# so root stays listed by 99-vps-hardening.conf. DenyUsers is checked before
# AllowUsers, which shuts root out regardless.
PermitRootLogin no
DenyUsers root

# Post-quantum key exchange first (OpenSSH 10 default; clients warn without
# it), then the classic curves from 99-vps-hardening.conf.
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
